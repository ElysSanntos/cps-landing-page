<footer class="footer">

  <div class="footer__gold-bar"></div>

  <div class="container">

    <!-- CONTATO -->
    <div class="footer__contact-row">
      <span>📍 Maringá — PR</span>
      <span class="footer__sep">|</span>
      <a [href]="whatsappLink"
         target="_blank"
         rel="noopener noreferrer"
         class="footer__contact-link"
         (click)="trackClick()">
        📞 (44) 99996-8191
      </a>
      <span class="footer__sep">|</span>
      <a href="mailto:contato&#64;cps-engenharia.com" class="footer__contact-link">
        <svg class="footer__icon footer__icon--envelope" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="M22 4L12 12 2 4"/>
          <circle cx="12" cy="12" r="2" stroke="#D4A743" stroke-width="1.5" fill="none"/>
          <path d="M14.5 12a2.5 2.5 0 10-5 0 2.5 2.5 0 005 0v.5a1.5 1.5 0 001.5 1.5" stroke="#D4A743" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
        contato&#64;cps-engenharia.com
      </a>
      <span class="footer__sep">|</span>
      <a href="https://cps-engenharia.com/cartao/"
         target="_blank"
         rel="noopener noreferrer"
         class="footer__card-link footer__contact-link">
        <svg class="footer__icon footer__icon--card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="3"/>
          <rect x="5" y="9" width="5" height="3" rx="1" stroke="#D4A743" stroke-width="1.3" fill="none"/>
          <path d="M13 10.5a3 3 0 010 3" stroke="#D4A743" stroke-width="1.3" fill="none"/>
          <path d="M15.5 8.5a6 6 0 010 7" stroke="#D4A743" stroke-width="1.3" fill="none"/>
        </svg>
        Cartão Digital
      </a>
    </div>

    <!-- SOCIAL -->
    <div class="footer__social-row">
      <a [href]="instagramLink"
         class="footer__social-link"
         target="_blank"
         rel="noopener noreferrer">
        <svg class="footer__icon footer__icon--instagram" viewBox="0 0 24 24" fill="none">
          <defs>
            <linearGradient id="insta-grad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FFDC80"/>
              <stop offset="25%" stop-color="#F77737"/>
              <stop offset="50%" stop-color="#E1306C"/>
              <stop offset="75%" stop-color="#C13584"/>
              <stop offset="100%" stop-color="#833AB4"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#insta-grad)" stroke-width="1.8"/>
          <circle cx="12" cy="11.37" r="4" stroke="url(#insta-grad)" stroke-width="1.8"/>
          <circle cx="17.5" cy="6.5" r="1.2" fill="url(#insta-grad)"/>
        </svg>
        &#64;cps_construcoes_servicos
      </a>

      <span class="footer__social-sep"></span>

      <a [href]="googleReviewLink"
         class="footer__social-link"
         target="_blank"
         rel="noopener noreferrer">
        <svg class="footer__icon footer__icon--star" viewBox="0 0 24 24" fill="none" stroke="#F5C518" stroke-width="1.8">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        Avaliar no Google
      </a>
    </div>

    <!-- COPYRIGHT -->
    <div class="footer__bottom">
      <p>© {{ year }} CPS Engenharia e Construções. Desenvolvido por <strong>ElisVerso</strong>.</p>
    </div>

  </div>

</footer>
