<nav class="navbar" [class.navbar--scrolled]="scrolled">

  <div class="container">

    <!-- Logo -->
    <a class="navbar__brand" (click)="scrollTo('hero')">
      <svg class="navbar__logo-icon" viewBox="0 0 70 70" width="38" height="38" fill="none">
        <!-- Prédio 1 (esq, menor) -->
        <polyline points="8,52 8,22 18,22 18,52" stroke="#D4A743" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Prédio 2 (centro, maior) -->
        <polyline points="22,52 22,8 38,8 38,52" stroke="#D4A743" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Prédio 3 (dir, médio) -->
        <polyline points="42,52 42,18 54,18 54,52" stroke="#D4A743" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Prédio 4 (extrema dir, pequeno) -->
        <polyline points="58,52 58,28 66,28 66,52" stroke="#D4A743" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Onda 1 -->
        <path d="M3,58 Q12,52 22,58 Q32,64 42,58 Q52,52 62,58 Q68,61 72,56" stroke="#D4A743" stroke-width="2" fill="none" stroke-linecap="round"/>
        <!-- Onda 2 -->
        <path d="M3,63 Q12,57 22,63 Q32,69 42,63 Q52,57 62,63 Q68,66 72,61" stroke="#D4A743" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="navbar__brand-texts">
        <span class="navbar__brand-title">
          CPS <span class="navbar__brand-highlight">Engenharia</span>
        </span>
        <span class="navbar__brand-sub">Construção e Serviços</span>
      </div>
    </a>

    <!-- Hamburger -->
    <button class="navbar__hamburger"
            (click)="toggleMenu()"
            [class.navbar__hamburger--active]="menuOpen"
            aria-label="Abrir menu"
            type="button">
      <span></span>
      <span></span>
      <span></span>
    </button>

  </div>

  <!-- Overlay -->
  @if (menuOpen) {
    <div class="navbar__overlay" (click)="closeMenu()">

      <div class="navbar__overlay-links" (click)="$event.stopPropagation()">
        <button (click)="scrollTo('hero')" class="navbar__overlay-link">Início</button>
        <button (click)="scrollTo('services')" class="navbar__overlay-link">Serviços</button>
        <button (click)="scrollTo('about')" class="navbar__overlay-link">Profissional</button>
        <button (click)="scrollTo('works')" class="navbar__overlay-link">Nossos Trabalhos</button>
        <a href="https://cps-engenharia.com/cartao/"
           target="_blank"
           rel="noopener noreferrer"
           class="navbar__overlay-link navbar__overlay-link--external"
           (click)="closeMenu()">
          Cartão Digital →
        </a>
      </div>

    </div>
  }

</nav>
